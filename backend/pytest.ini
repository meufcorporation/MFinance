[tool:pytest]
DJANGO_SETTINGS_MODULE = mfinance.test_settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --tb=short
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80
    --reuse-db
    --nomigrations
testpaths = tests
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    slow: Slow running tests
    auth: Authentication related tests
    finance: Finance module tests
    fop: FOP module tests
    payments: Payments module tests
    reports: Reports module tests
